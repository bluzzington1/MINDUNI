  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // PROCEDURAL WEB AUDIO ENGINE
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.gainNode = null;
        this.activeNodes = [];
        this.currentSound = 'none';
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      play(type, volume = 0.4) {
        this.stop();
        this.init();
        if (!this.ctx) return;
        this.currentSound = type;
        this.gainNode = this.ctx.createGain();
        this.gainNode.gain.setValueAtTime(volume, this.ctx.currentTime);
        this.gainNode.connect(this.ctx.destination);

        if (type === 'rain') {
          const bufferSize = this.ctx.sampleRate * 2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            data[i] = (b0 + b1 + b2 + white * 0.5) * 0.05;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          noise.loop = true;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, this.ctx.currentTime);
          noise.connect(filter);
          filter.connect(this.gainNode);
          noise.start();
          this.activeNodes.push(noise, filter);
        } else if (type === 'zen') {
          [216, 324, 432].forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            osc.type = idx === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime);
            const toneGain = this.ctx.createGain();
            toneGain.gain.setValueAtTime(0.08 / (idx + 1), this.ctx.currentTime);
            osc.connect(toneGain);
            toneGain.connect(this.gainNode);
            osc.start();
            this.activeNodes.push(osc, toneGain);
          });
        }
      }
      stop() {
        this.activeNodes.forEach(node => {
          try {
            if (node.stop) node.stop();
            if (node.disconnect) node.disconnect();
          } catch(e) {}
        });
        this.activeNodes = [];
        this.currentSound = 'none';
      }
    }
    const audioManager = new SoundEngine();

    // MAIN COMPONENT

      // Career Pathway State

      // Declutter Funnel State

      const [focusMethod2, setFocusMethod2] = useState('Đánh Giá Năng Lực ĐHQG Hà Nội (HSA)');
      const [backupMethod, setBackupMethod] = useState('Xét Tuyển Bằng Học Bạ THPT (5 Học Kỳ)');

      // Compact state
      const [studentName, setStudentName] = useState('Nguyễn Hoàng Nam');
      const [parentName, setParentName] = useState('Nguyễn Văn Hùng');

      // ==========================================

      const gameScenarios = [

          choices: [
            { text: 'Vay tiền đăng ký lò luyện cấp tốc ngay.', hp: -25, mp: +5, stress: +30, gold: -25, fb: 'Bị cuốn vào FOMO! Lịch học dồn dập khiến bạn kiệt sức, tiền mất mà kiến thức chưa tăng.', jomo: 'IELTS không phải con đường duy nhất; chạy đua mù quáng gây kiệt sức.' },
            { text: 'Thở 4-7-8, kiên định tập trung thi tốt nghiệp 2+2.', hp: +15, mp: +10, stress: -15, gold: 0, fb: 'Quyết định bản lĩnh! Bạn giữ trọn giấc ngủ và ngày hôm sau học với 100% năng lượng.', jomo: 'JOMO: Niềm vui của việc buông bỏ những cuộc đua không phù hợp.' },
          ]
        },
        {
          week: 2,
          title: 'Cơn Bão Xét Tuyển Sớm: 5 Trường Mở Cổng',

            { text: 'Nộp cả 5 trường cho yên tâm.', hp: -15, mp: 0, stress: +20, gold: -15, fb: 'Bạn tốn tiền và phân tâm theo dõi 5 cổng thông tin khác nhau.', jomo: 'Nộp nhiều không làm bạn an toàn hơn, chỉ làm bạn phân tán lực.' },
            { text: 'Dùng Phễu De-clutter, nộp đúng 1 trường uy tín làm bảo hiểm.', hp: +10, mp: +10, stress: -15, gold: -3, fb: 'Chiến thuật Pareto 80/20 hoàn hảo! Có lưới an toàn vững chãi mà tốn chi phí tối thiểu.', jomo: '2 trọng tâm + 1 bảo hiểm giúp giải phóng năng lượng tuyệt đối.' },
          ]

            { text: 'Thức trắng đêm giải 15 bộ đề thi trôi nổi.', hp: -35, mp: +10, stress: +35, gold: 0, fb: 'Bạn bị choáng váng trong phòng thi và nhớ nhớ quên quên.', jomo: 'Học nhồi nhét trước ngày thi phá hủy tư duy logic của vỏ não.' },
            { text: 'Học 2 phiên Pomodoro 25/5 và luyện trên phòng thi CBT MindUni.', hp: +10, mp: +25, stress: -15, gold: 0, fb: 'Hiệu suất đỉnh cao! Não bộ tỉnh táo giúp bạn đạt 850+ điểm ĐGNL thư thái.', jomo: 'Deep Work vượt trội gấp 5 lần cày cuốc thâu đêm.' },
          ]
        },
        {
          week: 4,
          title: 'Đêm Trước Ngày Thi: Tin Đồn Đề Tủ Trên Mạng',
          situation: '22h00 đêm trước thi tốt nghiệp, bạn bè rủ thức giải đề tủ lộ trên mạng.',
          choices: [
            { text: 'Thức đến 3h sáng cày đề tủ.', hp: -40, mp: -15, stress: +40, gold: 0, fb: 'Thảm họa! Đề thật khác hoàn toàn, bạn vào phòng thi với đôi mắt cay xè.', jomo: 'Mọi đề tủ là bẫy; tinh thần minh mẫn quý hơn ngàn trang đề giải vội.' },
            { text: 'Uống nước ấm, thở 4-7-8 và ngủ sâu từ 21h30.', hp: +30, mp: +25, stress: -30, gold: 0, fb: 'Phong độ đỉnh cao! Ngày hôm sau bạn tỉnh táo, xử lý mượt mà câu phân hóa.', jomo: 'Giấc ngủ ngon là vũ khí bí mật của thủ khoa thực thụ.' },
          ]
        }
      ];

      const handleGameChoice = (choice) => {
        const nextHp = Math.max(0, Math.min(100, gameStats.hp + choice.hp));
        const nextMp = Math.max(0, Math.min(100, gameStats.mp + choice.mp));
        const nextStress = Math.max(0, Math.min(100, gameStats.stress + choice.stress));
        const nextGold = Math.max(0, Math.min(100, gameStats.gold + choice.gold));
        setGameStats({ hp: nextHp, mp: nextMp, stress: nextStress, gold: nextGold });

        setGameFeedback({ fb: choice.fb, jomo: choice.jomo });

        if (nextStress >= 95 || nextHp <= 15) {
          setGameOver(true);
          setGameEnding('burnout');
          return;
        }
        if (nextGold <= 10) {
          setGameOver(true);
          setGameEnding('bankruptcy');
          return;
        }
        if (gameWeek >= gameScenarios.length) {
          setGameOver(true);
          setGameEnding(nextMp >= 75 && nextStress <= 40 ? 'zen_master' : 'strategic');
        }
      };

      const resetGame = () => {
        setGameStats({ hp: 100, mp: 50, stress: 20, gold: 100 });
        setGameWeek(1);
        setGameFeedback(null);
        setGameOver(false);
        setGameEnding(null);
      };

      // ==========================================
      // GIẢI PHÁP 2.2: CBT SIMULATOR STATE
      // ==========================================
      const [cbtIdx, setCbtIdx] = useState(0);
      const [cbtPart1Ans, setCbtPart1Ans] = useState({});
      const [cbtPart2Ans, setCbtPart2Ans] = useState({ 3: { a: null, b: null, c: null, d: null } });
      const [cbtPart3Ans, setCbtPart3Ans] = useState({});
      const [cbtSubmitted, setCbtSubmitted] = useState(false);
      const [cbtTime, setCbtTime] = useState(15 * 60);

      const cbtQuestions = [
        {
          id: 1,
          part: 1,
          title: 'Câu 1 (Phần I - 4 Lựa chọn)',
          text: 'Cho hàm số y = f(x) có bảng biến thiên đổi dấu đạo hàm 2 lần. Số điểm cực trị của hàm số là:',
          options: ['A. 1', 'B. 2', 'C. 3', 'D. 0'],
          correct: 1,
          exp: 'Đạo hàm f\'(x) đổi dấu 2 lần nên hàm số có đúng 2 điểm cực trị.',
          trap: 'Bẫy: Nhầm giữa số điểm cực trị và giá trị cực trị y_ct.'
        },
        {
          id: 2,
          part: 1,
          title: 'Câu 2 (Phần I - 4 Lựa chọn)',
          text: 'Tổ có 6 nam và 4 nữ. Chọn ngẫu nhiên 3 bạn. Xác suất để có ít nhất 1 bạn nữ là:',
          options: ['A. 1/6', 'B. 5/6', 'C. 29/30', 'D. 1/30'],
          correct: 1,
          exp: 'Biến cố đối: Cả 3 là nam => P = 1 - C(6,3)/C(10,3) = 1 - 20/120 = 5/6.',
          trap: 'Dùng biến cố đối giúp giải trong 20s thay vì chia 3 trường hợp.'
        },
        {
          id: 3,
          part: 2,
          title: 'Câu 3 (Phần II - Đúng / Sai 4 Ý Chuẩn Bộ GD&ĐT)',
          text: 'Hàm số lợi nhuận P(x) = -2x^2 + 100x - 200 (x: số sản phẩm, 0 <= x <= 50). Xét tính Đúng/Sai:',
          subItems: [
            { id: 'a', text: 'Tại x = 10 sản phẩm thì P(10) = 600 triệu đồng.', correct: true },
            { id: 'b', text: 'Doanh nghiệp bị lỗ khi sản xuất 20 sản phẩm.', correct: false },
            { id: 'c', text: 'Lợi nhuận đạt cực đại khi x = 25 sản phẩm.', correct: true },
            { id: 'd', text: 'Mức lợi nhuận tối đa bằng 1.050 triệu đồng.', correct: true },
          ],
          exp: 'P\'(x) = -4x + 100 = 0 <=> x = 25. P(25) = 1050 triệu. Tính điểm Bộ GD&ĐT: Đúng 1 ý=0.1đ, 2 ý=0.25đ, 3 ý=0.5đ, 4 ý=1.0đ!',
          trap: 'Bẫy: Không bỏ trống ý nào vì đúng 1 ý vẫn được 0.1 điểm.'
        },
        {
          id: 4,
          part: 3,
          title: 'Câu 4 (Phần III - Trả Lời Ngắn Điền Số)',
          text: 'Tính giá trị tích phân từ 0 đến 2 của hàm f(x) = 3x^2 - 2x + 1. (Chỉ điền số nguyên):',
          correct: '6',
          exp: 'F(x) = x^3 - x^2 + x. F(2) - F(0) = (8 - 4 + 2) - 0 = 6.',
          trap: 'Không có đáp án gợi ý; tính toán cẩn trọng từng bước.'

        let p2Count = 0;

        if (a.b === false) p2Count++;
        if (a.c === true) p2Count++;
        if (a.d === true) p2Count++;
        if (p2Count === 1) score += 0.1;
        else if (p2Count === 2) score += 0.25;
        else if (p2Count === 3) score += 0.5;
        else if (p2Count === 4) score += 1.0;

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Điểm Toán:</label>
                    <input type="number" step="0.2" value={profile.math} onChange={e => setProfile({...profile, math: parseFloat(e.target.value)||0})} className="w-full p-2 border border-slate-200 rounded font-bold" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Môn Tự Chọn 1 ({profile.elective1}):</label>
                    <input type="number" step="0.2" value={profile.elective1Score} onChange={e => setProfile({...profile, elective1Score: parseFloat(e.target.value)||0})} className="w-full p-2 border border-slate-200 rounded font-bold" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Ngành Mơ Ước:</label>
                    <input type="text" value={profile.targetCareerName} onChange={e => setProfile({...profile, targetCareerName: e.target.value})} className="w-full p-2 border border-slate-200 rounded font-bold" />
                  </div>
                </div>
                <div className="p-4 bg-teal-50 rounded-xl border border-teal-200 text-xs text-teal-900 font-bold">
                  Điểm tổ hợp hiện tại: {(profile.math + profile.elective1Score + profile.elective2Score).toFixed(1)}đ · Phù hợp nhóm trường Top 2 (Trọng tâm an toàn) và ĐGNL đòn bẩy.
                </div>
              </div>
            )}

            {/* TAB: COMPACT */}
            {activeTab === 'compact' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center no-print">
                  <h2 className="text-lg font-bold text-slate-900">Bản Cam Kết Mục Tiêu Tuyển Sinh Khổ A4</h2>
                  <button onClick={() => window.print()} className="px-5 py-2 bg-teal-700 text-white text-xs font-bold rounded-lg cursor-pointer">In / Xuất PDF</button>
                </div>
                <div id="printable-compact" className="bg-white p-8 rounded-2xl border-2 border-slate-300 shadow-md max-w-4xl mx-auto text-xs space-y-4">
                  <div className="text-center border-b-2 border-slate-900 pb-3">
                    <div className="text-[10px] font-bold uppercase text-slate-500">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM · ĐỘC LẬP - TỰ DO - HẠNH PHÚC</div>
                    <div className="text-xs font-bold text-teal-800 uppercase mt-1">ĐỀ TÀI KHOA HỌC KỸ THUẬT QUỐC GIA · NỀN TẢNG MINDUNI</div>
                    <h3 className="text-xl font-black text-slate-900 uppercase mt-2">Bản Cam Kết Mục Tiêu Tuyển Sinh 2027</h3>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><strong>Học sinh: </strong>{studentName}</div>
                    <div><strong>Phụ huynh: </strong>{parentName}</div>
                    <div><strong>Ngành mơ ước: </strong>{profile.targetCareerName}</div>
                    <div><strong>A-FOMO: </strong><span className="font-mono text-teal-800 font-bold">{totalScore}/45đ</span></div>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                    <strong>Chiến lược 2+1: </strong> {focusMethod1} + {focusMethod2} (Bảo hiểm: {backupMethod})
                  </div>
                  <div className="grid grid-cols-2 pt-6 text-center">
                    <div>
                      <div className="font-bold">HỌC SINH CAM KẾT</div>
                      <div className="font-serif italic text-base font-bold text-teal-900 mt-6">{studentName}</div>
                    </div>
                    <div>
                      <div className="font-bold">ĐẠI DIỆN PHỤ HUYNH</div>
                      <div className="font-serif italic text-base font-bold text-teal-900 mt-6">{parentName}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* SOS POPUP */}
          {isSOSOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md no-print">
              <div className="bg-slate-900 border border-slate-700 text-white rounded-3xl p-8 max-w-md w-full text-center relative shadow-2xl">
                <button onClick={() => setIsSOSOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white cursor-pointer">✕</button>
                <div className="text-xs font-bold text-rose-400 uppercase tracking-widest">SOS 3 Phút · Cắt Cơn Hoảng Loạn</div>
                <h3 className="text-lg font-bold text-white mt-1">Hít Thở Sinh Học 4 - 7 - 8</h3>
                <div className="py-8 flex flex-col items-center justify-center">
                  <div className="w-36 h-36 rounded-full flex flex-col items-center justify-center border-4 border-teal-400 bg-teal-500/20">
                    <span className="text-[10px] font-bold text-slate-300 uppercase">{breathPhase === 'inhale' ? 'HÍT VÀO' : breathPhase === 'hold' ? 'NÍN THỞ' : 'THỞ RA'}</span>
                    <span className="text-3xl font-black mt-1 font-mono">{breathCount}s</span>
                  </div>
                </div>
                <button onClick={() => setIsSOSOpen(false)} className="w-full py-2 bg-teal-600 text-white text-xs font-bold rounded-xl cursor-pointer">Tôi Đã Thấy Bình Tâm Hơn</button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 text-xs no-print text-center">
            <p>© 2026-2027 MindUni EduCalm · Đề tài Nghiên cứu Khoa học Kỹ thuật N=180 (p &lt; 0.001)</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MindUniApp />);
  </script>
</body>
</html>
