  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // PROCEDURAL WEB AUDIO ENGINE
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.gainNode = null;
        this.activeNodes = [];
        this.currentSound = 'none';
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      play(type, volume = 0.4) {
        this.stop();
        this.init();
        if (!this.ctx) return;
        this.currentSound = type;
        this.gainNode = this.ctx.createGain();
        this.gainNode.gain.setValueAtTime(volume, this.ctx.currentTime);
        this.gainNode.connect(this.ctx.destination);

        if (type === 'rain') {
          const bufferSize = this.ctx.sampleRate * 2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            data[i] = (b0 + b1 + b2 + white * 0.5) * 0.05;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          noise.loop = true;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, this.ctx.currentTime);
          noise.connect(filter);
          filter.connect(this.gainNode);
          noise.start();
          this.activeNodes.push(noise, filter);
        } else if (type === 'zen') {
          [216, 324, 432].forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            osc.type = idx === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime);
            const toneGain = this.ctx.createGain();
            toneGain.gain.setValueAtTime(0.08 / (idx + 1), this.ctx.currentTime);
            osc.connect(toneGain);
            toneGain.connect(this.gainNode);
            osc.start();
            this.activeNodes.push(osc, toneGain);
          });
        }
      }
      stop() {
        this.activeNodes.forEach(node => {
          try {
            if (node.stop) node.stop();
            if (node.disconnect) node.disconnect();
          } catch(e) {}
        });
        this.activeNodes = [];
        this.currentSound = 'none';
      }
    }
    const audioManager = new SoundEngine();

    // MAIN COMPONENT
    function MindUniApp() {

      // Assessment State
      const [answers, setAnswers] = useState({ 1:4, 2:4, 3:3, 4:4, 5:3, 6:4, 7:5, 8:4, 9:3 });

      const afomoQuestions = [
        { id: 1, text: 'Em luôn cảm thấy phải đăng ký nhiều kỳ thi (ĐGNL, V-SAT, tốt nghiệp) cùng lúc vì sợ một phương thức là không an toàn.' },

        { id: 3, text: 'Em cảm thấy tội lỗi hoặc bất an dữ dội nếu một ngày em dành thời gian nghỉ ngơi thay vì cày đề.' },
        { id: 4, text: 'Khi thấy các trường đại học mở cổng xét tuyển sớm, em cảm thấy hoảng loạn và muốn nộp hồ sơ dù chưa tìm hiểu kỹ.' },
        { id: 5, text: 'Em sợ rằng nếu chỉ tập trung vào kỳ thi tốt nghiệp 2+2, em sẽ bị tụt hậu và mất hết chỉ tiêu vào tay người khác.' },
        { id: 6, text: 'Dù đã có một chứng chỉ hoặc phương án an toàn, em vẫn tiếp tục đăng ký thêm các đợt thi khác cho "yên tâm".' },
        { id: 7, text: 'Mỗi khi lướt mạng xã hội thấy bạn bè khoe IELTS cao hoặc đỗ sớm trường top, em thấy mình kém cỏi và thất bại.' },
        { id: 8, text: 'Các cuộc trò chuyện trên lớp về điểm số và kỳ thi khiến em lo lắng và cảm giác nghẹt thở.' },
        { id: 9, text: 'Em có xu hướng đăng ký những ngành học hoặc kỳ thi mà "nhiều bạn giỏi đang theo" thay vì dựa trên khả năng thực sự.' },
      ];

      const totalScore = Object.values(answers).reduce((a, b) => a + b, 0);

      if (totalScore >= 32) {
        zone = 'red';
        zoneTitle = 'Vùng Đỏ: Báo Động Quá Tải & Nguy Cơ Hoảng Loạn (32 - 45 điểm)';
        zoneColor = 'bg-rose-100 text-rose-900 border-rose-300';
      } else if (totalScore <= 18) {
        zone = 'green';
        zoneTitle = 'Vùng Xanh: Cân Bằng & Kiểm Soát Tốt (9 - 18 điểm)';
        zoneColor = 'bg-emerald-100 text-emerald-900 border-emerald-300';
      }

      // Career Pathway State
      const [profile, setProfile] = useState({
        gpa: 8.3,
        math: 8.4,
        lit: 7.5,
        elective1: 'Vật lý',
        elective1Score: 8.0,
        elective2: 'Hóa học',
        elective2Score: 7.8,
        careerId: 'ai_tech',
        targetCareerName: 'Kỹ Sư Trí Tuệ Nhân Tạo & Phần Mềm (AI & Software)',
      });

      // Declutter Funnel State
      const [focusMethod1, setFocusMethod1] = useState('Kỳ Thi Tốt Nghiệp THPT (2+2 Mới)');
      const [focusMethod2, setFocusMethod2] = useState('Đánh Giá Năng Lực ĐHQG Hà Nội (HSA)');
      const [backupMethod, setBackupMethod] = useState('Xét Tuyển Bằng Học Bạ THPT (5 Học Kỳ)');

      // Pomodoro & Breathing
      const [pomoSec, setPomoSec] = useState(25 * 60);
      const [pomoRunning, setPomoRunning] = useState(false);
      const [breathPhase, setBreathPhase] = useState('inhale');

      // Compact state

      // Countdown
      const [daysLeft, setDaysLeft] = useState(0);
      useEffect(() => {
        const target = new Date('2027-06-25T07:00:00').getTime();
        const now = new Date().getTime();
        const diff = Math.max(0, target - now);
        setDaysLeft(Math.floor(diff / (1000 * 60 * 60 * 24)));
      }, []);

      // Breathing loop in SOS
      useEffect(() => {
        let t = null;
        if (isSOSOpen) {
          t = setInterval(() => {
            setBreathCount(prev => {
              if (prev > 1) return prev - 1;
              if (breathPhase === 'inhale') { setBreathPhase('hold'); return 7; }
              if (breathPhase === 'hold') { setBreathPhase('exhale'); return 8; }
              setBreathPhase('inhale'); return 4;
            });
          }, 1000);
        }
        return () => clearInterval(t);
      }, [isSOSOpen, breathPhase]);

      // Pomodoro loop
      useEffect(() => {
        let timer = null;
        if (pomoRunning && pomoSec > 0) {
          timer = setInterval(() => setPomoSec(p => p - 1), 1000);
        }
        return () => clearInterval(timer);
      }, [pomoRunning, pomoSec]);

      return (

                <button onClick={() => setActiveTab('declutter')} className={`py-1 border-b-2 cursor-pointer ${activeTab === 'declutter' ? 'border-teal-700 text-teal-800' : 'border-transparent hover:text-slate-900'}`}>Phễu De-Clutter</button>
                <button onClick={() => setActiveTab('career_pathway')} className={`py-1 border-b-2 cursor-pointer ${activeTab === 'career_pathway' ? 'border-teal-700 text-teal-800' : 'border-transparent hover:text-slate-900'}`}>Lộ Trình Ước Mơ</button>
                <button onClick={() => setActiveTab('zen')} className={`py-1 border-b-2 cursor-pointer ${activeTab === 'zen' ? 'border-teal-700 text-teal-800' : 'border-transparent hover:text-slate-900'}`}>Tĩnh Tâm & Pomodoro</button>

              </nav>
              <button
                onClick={() => setIsSOSOpen(true)}

                <span>SOS 3 Phút</span>

          {/* MAIN CONTENT AREA */}

              <div className="flex items-center gap-2 text-xs font-bold text-teal-300 uppercase tracking-wider mb-2">

                Nền tảng số hỗ trợ tâm lý cá nhân hóa MindUni (EduCalm) ứng dụng thang đo A-FOMO Index, phễu cắt tỉa quyết định logic Pareto 80/20, thiết kế lộ trình nghề nghiệp ước mơ từ điểm số và xuất bản cam kết A4 cùng gia đình.

                <button onClick={() => setActiveTab('compact')} className="px-5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white cursor-pointer">Xuất Bản Cam Kết A4</button>
              </div>
            </div>

            {/* TAB 1: AFOMO ASSESSMENT */}
            {activeTab === 'assessment' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-7 bg-white p-6 sm:p-8 rounded-2xl border border-slate-200">

                  <div className="space-y-4">
                    {afomoQuestions.map(q => (
                      <div key={q.id} className="p-4 rounded-xl border border-slate-100 bg-slate-50/50">
                        <div className="text-xs font-semibold text-slate-800 mb-2">Câu {q.id}: {q.text}</div>
                        <div className="grid grid-cols-5 gap-1.5">
                          {[1, 2, 3, 4, 5].map(val => (
                            <button
                              key={val}
                              onClick={() => setAnswers({...answers, [q.id]: val})}
                              className={`py-1.5 rounded text-xs font-bold transition-all cursor-pointer ${answers[q.id] === val ? 'bg-teal-700 text-white shadow-xs' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}`}

                <div className="lg:col-span-5 space-y-6">

                {/* 168-Hour Energy Re-allocation Visualizer */}

                  <button onClick={() => setShowUnivModal(null)} className="text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
                </div>
                <div className="mt-4 space-y-3 text-slate-700">
                  <div className="p-3 bg-teal-50 rounded-lg border border-teal-200">
                    <strong>Chỉ tiêu & Phương thức: </strong>
                    {showUnivModal === 1 && 'ĐGNL/ĐGTD chiếm 45-50%, Thi Tốt nghiệp THPT 35-40% (điểm mỗi môn >= 9.0).'}
                    {showUnivModal === 2 && 'Thi Tốt nghiệp THPT 2+2 chiếm 55-60%, ĐGNL 30%. Tỷ lệ chọi hợp lý, cơ hội việc làm rộng mở.'}
                    {showUnivModal === 3 && 'Học bạ THPT chiếm 60-70%, điểm thi tốt nghiệp mức vừa phải, an toàn 100% không trượt.'}
                  </div>
                  <p><strong>Lời khuyên chiến lược: </strong>
                    {showUnivModal === 1 && 'Giữ vững tâm lý không áp lực; chuẩn bị tối đa 1 kỳ thi ĐGNL làm đòn bẩy sớm.'}
                    {showUnivModal === 2 && 'Đây là vùng an toàn đắc địa nhất của bạn! Dốc 80% sức vào kỳ thi tốt nghiệp 2+2.'}
                    {showUnivModal === 3 && 'Nộp hồ sơ xét tuyển sớm trước tháng 5 để có sẵn 1 vé đại học giúp tâm lý thoải mái nhất.'}
                  </p>
                </div>
                <button onClick={() => setShowUnivModal(null)} className="mt-4 w-full py-2 bg-teal-700 text-white rounded-lg text-xs font-bold cursor-pointer">Đã Hiểu</button>
              </div>
            </div>
          )}

          {/* STATS RESEARCH MODAL */}
          {showStatsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs no-print">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 text-xs">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-slate-900 text-sm">Dữ Liệu Thống Kê Nghiên Cứu KHKT (N=180)</h3>
                  <button onClick={() => setShowStatsModal(false)} className="text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
                </div>
                <div className="mt-4 space-y-3">
                  <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                    <div className="font-bold text-slate-900">Ma Trận Tương Quan Pearson:</div>
                    <p className="mt-1">· Số kỳ thi đăng ký vs Điểm hoảng loạn A-FOMO: <strong>r = +0.742, p &lt; 0.001</strong> (Tương quan thuận rất mạnh).</p>
                    <p>· Sử dụng Phễu De-clutter vs Điểm thi tốt nghiệp thực tế: <strong>r = +0.612, p &lt; 0.001</strong>.</p>
                  </div>
                  <div className="p-3 bg-teal-50 rounded-lg border border-teal-200 text-teal-950">
                    <strong>Hiệu quả can thiệp:</strong> Điểm A-FOMO trung bình giảm từ 36.4 xuống 18.2 sau 8 tuần (t(89)=14.82, Cohen's d=1.84).
                  </div>
                </div>
                <button onClick={() => setShowStatsModal(false)} className="mt-4 w-full py-2 bg-teal-700 text-white rounded-lg text-xs font-bold cursor-pointer">Đóng</button>
              </div>
            </div>
          )}

          {/* SOS POPUP MODAL */}
          {isSOSOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md no-print">
              <div className="bg-slate-900 border border-slate-700 text-white rounded-3xl p-8 max-w-md w-full text-center relative shadow-2xl">
                <button onClick={() => setIsSOSOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white cursor-pointer">✕</button>
                <div className="text-xs font-bold text-rose-400 uppercase tracking-widest">SOS 3 Phút · Cắt Cơn Hoảng Loạn</div>
                <h3 className="text-lg font-bold text-white mt-1">Hít Thở Sinh Học 4 - 7 - 8</h3>
                <div className="py-8 flex flex-col items-center justify-center">
                  <div className={`w-40 h-40 rounded-full flex flex-col items-center justify-center border-4 transition-all duration-1000 ${breathPhase === 'inhale' ? 'scale-110 bg-teal-500/20 border-teal-400' : breathPhase === 'hold' ? 'scale-110 bg-amber-500/20 border-amber-400' : 'scale-90 bg-sky-500/10 border-sky-400'}`}>
                    <span className="text-[10px] font-bold text-slate-300 uppercase">{breathPhase === 'inhale' ? 'HÍT VÀO' : breathPhase === 'hold' ? 'NÍN THỞ' : 'THỞ RA'}</span>
                    <span className="text-4xl font-black mt-1 font-mono">{breathCount}s</span>
                  </div>
                </div>
                <button onClick={() => setIsSOSOpen(false)} className="w-full py-2.5 bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold rounded-xl cursor-pointer">Tôi Đã Thấy Bình Tâm Hơn</button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs no-print text-center">
            <p>© 2026-2027 MindUni EduCalm · Đề tài Nghiên cứu Khoa học Kỹ thuật N=180 (p &lt; 0.001)</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MindUniApp />);
  </script>
</body>
</html>
